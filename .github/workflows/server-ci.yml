name: Server CI

on:
  pull_request:
    paths: ["server/**", "shared/**", ".github/workflows/server-*.yml"]
  push:
    branches: [main]
    paths: ["server/**", "shared/**", ".github/workflows/server-*.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
